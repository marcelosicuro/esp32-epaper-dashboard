substitutions:
  device_name: painel-pessoal
  friendly_name: "Painel Pessoal"
  latitude:  "-26.3044"
  longitude: "-48.8487"
  timezone:  "America/Sao_Paulo"
  spi_clk:     GPIO8
  spi_mosi:    GPIO10
  epaper_cs:   GPIO3
  epaper_dc:   GPIO5
  epaper_rst:  GPIO2
  epaper_busy: GPIO4

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - delay: 12s
      - script.execute: fetch_all

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_BROWNOUT_DET: "n"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Painel Setup"
    password: !secret ap_password

captive_portal:
logger:
  level: DEBUG
  logs:
    http_request: DEBUG

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80

api:
  encryption:
    key: !secret api_key

sensor:
  - platform: internal_temperature
    id: cpu_temp_sensor
    name: "CPU Temperature"
    update_interval: 60s

  - platform: wifi_signal
    id: wifi_rssi_sensor
    name: "WiFi RSSI"
    update_interval: 60s

  - platform: uptime
    id: uptime_sensor
    name: "Uptime"
    unit_of_measurement: "s"
    update_interval: 60s

time:
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
    servers:
      - pool.ntp.org
      - 1.br.pool.ntp.org
    on_time_sync:
      then:
        - logger.log: "NTP sincronizado"

interval:
  - interval: 20min
    then:
      - script.execute: fetch_all

http_request:
  useragent: esphome/painel-pessoal
  timeout: 15s
  verify_ssl: false
  buffer_size_rx: 16384
  buffer_size_tx: 512

globals:
  - id: g_usd_brl
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: g_btc_brl
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: g_rates_ok
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_upd_h
    type: int
    restore_value: false
    initial_value: '-1'
  - id: g_upd_m
    type: int
    restore_value: false
    initial_value: '-1'
  - id: g_temp
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: g_humidity
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_weather_code
    type: int
    restore_value: false
    initial_value: '-1'
  - id: g_weather_ok
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_fc_code
    type: int[5]
    restore_value: false
    initial_value: "{-1,-1,-1,-1,-1}"
  - id: g_fc_tmax
    type: float[5]
    restore_value: false
    initial_value: "{0,0,0,0,0}"
  - id: g_fc_tmin
    type: float[5]
    restore_value: false
    initial_value: "{0,0,0,0,0}"
  - id: g_fc_ok
    type: bool
    restore_value: false
    initial_value: 'false'
  # histórico diário (mais antigo -> mais recente) para os gráficos
  - id: g_usd_hist
    type: float[30]
    restore_value: false
    initial_value: "{0.0f}"
  - id: g_usd_n
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_btc_hist
    type: float[30]
    restore_value: false
    initial_value: "{0.0f}"
  - id: g_btc_n
    type: int
    restore_value: false
    initial_value: '0'

script:
  - id: fetch_all
    mode: single
    then:
      - script.execute: fetch_weather
      - script.execute: fetch_rates
      - script.execute: fetch_history
      - script.wait:   fetch_weather
      - script.wait:   fetch_rates
      - script.wait:   fetch_history
      - component.update: epaper_display

  - id: fetch_weather
    mode: single
    then:
      - http_request.get:
          url: "https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=6&timezone=auto"
          headers:
            Accept-Encoding: identity
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) return;
                  json::parse_json(body, [](JsonObject root) -> bool {
                    auto cur = root["current"];
                    if (cur.isNull()) return false;
                    id(g_temp)         = cur["temperature_2m"].as<float>();
                    id(g_humidity)     = cur["relative_humidity_2m"].as<int>();
                    id(g_weather_code) = cur["weather_code"].as<int>();
                    id(g_weather_ok)   = true;
                    ESP_LOGI("clima", "OK: code=%d temp=%.1f umid=%d", id(g_weather_code), id(g_temp), id(g_humidity));
                    auto daily = root["daily"];
                    if (!daily.isNull()) {
                      JsonArray codes = daily["weather_code"].as<JsonArray>();
                      JsonArray tmax  = daily["temperature_2m_max"].as<JsonArray>();
                      JsonArray tmin  = daily["temperature_2m_min"].as<JsonArray>();
                      for (int i = 0; i < 5; i++) {
                        id(g_fc_code)[i] = codes[i+1].as<int>();
                        id(g_fc_tmax)[i] = tmax[i+1].as<float>();
                        id(g_fc_tmin)[i] = tmin[i+1].as<float>();
                      }
                      id(g_fc_ok) = true;
                    }
                    return true;
                  });

  - id: fetch_rates
    mode: single
    then:
      - http_request.get:
          url: "https://economia.awesomeapi.com.br/last/USD-BRL,BTC-BRL"
          headers:
            Accept-Encoding: identity
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) return;
                  json::parse_json(body, [](JsonObject root) -> bool {
                    auto usd = root["USDBRL"];
                    auto btc = root["BTCBRL"];
                    if (!usd.isNull()) id(g_usd_brl) = atof(usd["bid"].as<const char*>());
                    if (!btc.isNull()) id(g_btc_brl) = atof(btc["bid"].as<const char*>());
                    id(g_rates_ok) = true;
                    auto t = id(sntp_time).now();
                    id(g_upd_h) = t.hour; id(g_upd_m) = t.minute;
                    return true;
                  });

  - id: fetch_history
    mode: single
    then:
      - http_request.get:
          url: "https://economia.awesomeapi.com.br/json/daily/USD-BRL/30"
          max_response_buffer_size: 8kB
          headers:
            Accept-Encoding: identity
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  ESP_LOGI("hist", "usd http=%d body=%d bytes", response->status_code, (int) body.size());
                  if (response->status_code != 200) return;
                  // a resposta é uma lista; embrulha num objeto p/ usar json::parse_json
                  std::string wrapped = "{\"a\":" + body + "}";
                  bool ok_usd = json::parse_json(wrapped, [](JsonObject root) -> bool {
                    JsonArray arr = root["a"].as<JsonArray>();
                    int n = arr.size() < 30 ? (int) arr.size() : 30;
                    // a API devolve do mais novo para o mais antigo
                    for (int i = 0; i < n; i++)
                      id(g_usd_hist)[n - 1 - i] = atof(arr[i]["bid"].as<const char*>());
                    id(g_usd_n) = n;
                    return true;
                  });
                  ESP_LOGI("hist", "usd parse=%d n=%d", ok_usd, id(g_usd_n));
      - http_request.get:
          url: "https://economia.awesomeapi.com.br/json/daily/BTC-BRL/30"
          max_response_buffer_size: 8kB
          headers:
            Accept-Encoding: identity
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  ESP_LOGI("hist", "btc http=%d body=%d bytes", response->status_code, (int) body.size());
                  if (response->status_code != 200) return;
                  // a resposta é uma lista; embrulha num objeto p/ usar json::parse_json
                  std::string wrapped = "{\"a\":" + body + "}";
                  bool ok_btc = json::parse_json(wrapped, [](JsonObject root) -> bool {
                    JsonArray arr = root["a"].as<JsonArray>();
                    int n = arr.size() < 30 ? (int) arr.size() : 30;
                    for (int i = 0; i < n; i++)
                      id(g_btc_hist)[n - 1 - i] = atof(arr[i]["bid"].as<const char*>());
                    id(g_btc_n) = n;
                    return true;
                  });
                  ESP_LOGI("hist", "btc parse=%d n=%d", ok_btc, id(g_btc_n));

